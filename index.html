<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy アニマル 🐦💀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  }
  #game-container {
    position: relative;
    display: inline-block;
  }
  canvas {
    border: 4px solid #e94560;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(233,69,96,0.4);
    cursor: pointer;
    max-width: 100vw;
    max-height: 100vh;
    display: block;
  }
  #name-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  #name-overlay.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  #name-input {
    background: rgba(0,0,0,0.85);
    border: 2px solid #e94560;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    padding: 8px 16px;
    text-align: center;
    width: 220px;
    outline: none;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  }
  #name-input::placeholder { color: rgba(255,255,255,0.4); }
  #name-label {
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 0 0 8px #000, 0 0 16px #000;
  }
  #name-submit {
    margin-top: 10px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 28px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  }
  #name-submit:hover { background: #ff5a78; }
  #name-skip {
    margin-top: 8px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 8px;
    padding: 6px 24px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  }
  #name-skip:hover { background: #e0e0e0; }
</style>
</head>
<body>
<div id="game-container">
<canvas id="game"></canvas>
<div id="name-overlay">
  <div id="name-label">名前を入力してね</div>
  <input type="text" id="name-input" placeholder="なまえ" maxlength="10" autocomplete="off">
  <button id="name-submit">登録</button>
  <button id="name-skip">スキップ</button>
</div>
</div>

// --- Ranking system (persistent storage) ---
let rankings = [];
let rankingsLoaded = false;

async function loadRankings() {
  try {
    const result = await window.storage.get('flappy_rankings');
    if (result && result.value) {
      rankings = JSON.parse(result.value);
    }
  } catch (e) {
    rankings = [];
  }
  rankingsLoaded = true;
}

async function saveRanking(name, sc) {
  rankings.push({ name: name, score: sc, date: new Date().toLocaleDateString('ja-JP') });
  rankings.sort((a, b) => b.score - a.score);
  rankings = rankings.slice(0, 10); // keep top 10
  try {
    await window.storage.set('flappy_rankings', JSON.stringify(rankings));
  } catch (e) {
    console.error('Failed to save ranking:', e);
  }
}

loadRankings();

// --- Name input handling ---
let nameRegistered = false;
let showingRanking = false;
const nameOverlay = document.getElementById('name-overlay');
const nameInput = document.getElementById('name-input');
const nameSubmit = document.getElementById('name-submit');

function showNameInput() {
  nameOverlay.classList.add('active');
  nameInput.value = '';
  nameInput.focus();
}

function hideNameInput() {
  nameOverlay.classList.remove('active');
}

nameSubmit.addEventListener('click', async (e) => {
  e.stopPropagation();
  const name = nameInput.value.trim() || '名無し';
  await saveRanking(name, score);
  nameRegistered = true;
  showingRanking = true;
  hideNameInput();
});

nameInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    nameSubmit.click();
  }
});

const nameSkip = document.getElementById('name-skip');
nameSkip.addEventListener('click', (e) => {
  e.stopPropagation();
  nameRegistered = true;
  showingRanking = false;
  hideNameInput();
  resetGame();
});

// --- Base constants ---
const GRAVITY = 0.45;
const JUMP_FORCE = -7.5;
const PIPE_WIDTH = 60;
const MOVING_PIPE_EXTRA = 16;
const BASE_PIPE_GAP = 155;
const BASE_PIPE_SPEED = 2.5;
const BASE_PIPE_INTERVAL = 1600;
const GROUND_HEIGHT = 60;

// --- Difficulty system ---
function getDifficulty(score) {
  const level = Math.min(Math.floor(score / 5), 10);
  return {
    pipeSpeed: BASE_PIPE_SPEED + level * 0.25,
    pipeGap: Math.max(BASE_PIPE_GAP - level * 4, 100),
    pipeInterval: Math.max(BASE_PIPE_INTERVAL - level * 80, 900),
    pipeMovement: level >= 2,
    pipeAmplitude: Math.min(level * 8, 60),
    pipeOscillationSpeed: 0.02 + level * 0.003,
    level: level
  };
}

// --- Weather system ---
const WEATHERS = ['sunny', 'cloudy', 'rain', 'snow', 'sunset', 'night'];
let currentWeather = 'sunny';
let weatherParticles = [];

function pickWeather() {
  currentWeather = WEATHERS[Math.floor(Math.random() * WEATHERS.length)];
  weatherParticles = [];
}

function getWeatherColors() {
  switch (currentWeather) {
    case 'sunny': return { skyTop: '#87CEEB', skyMid: '#B0E0FF', skyBot: '#E8F8FF', cloud: 'rgba(255,255,255,0.7)' };
    case 'cloudy': return { skyTop: '#7B8D9E', skyMid: '#9EADB8', skyBot: '#C5CED5', cloud: 'rgba(200,200,210,0.8)' };
    case 'rain': return { skyTop: '#4A5568', skyMid: '#6B7B8D', skyBot: '#8899A6', cloud: 'rgba(150,160,170,0.85)' };
    case 'snow': return { skyTop: '#A8B5C5', skyMid: '#C8D3DE', skyBot: '#E8EDF2', cloud: 'rgba(230,235,240,0.8)' };
    case 'sunset': return { skyTop: '#1A1A3E', skyMid: '#C84B31', skyBot: '#FFAD60', cloud: 'rgba(255,180,120,0.6)' };
    case 'night': return { skyTop: '#0D1117', skyMid: '#161B22', skyBot: '#21262D', cloud: 'rgba(40,50,70,0.6)' };
    default: return { skyTop: '#87CEEB', skyMid: '#B0E0FF', skyBot: '#E8F8FF', cloud: 'rgba(255,255,255,0.7)' };
  }
}

function spawnWeatherParticle() {
  if (currentWeather === 'rain') {
    weatherParticles.push({ x: Math.random() * W, y: -10, speed: 6 + Math.random() * 4, length: 8 + Math.random() * 12, wind: -1.5 });
  } else if (currentWeather === 'snow') {
    weatherParticles.push({ x: Math.random() * (W + 40) - 20, y: -10, speed: 0.8 + Math.random() * 1.5, size: 2 + Math.random() * 4, wobble: Math.random() * Math.PI * 2, wobbleSpeed: 0.02 + Math.random() * 0.03 });
  }
}

function updateWeatherParticles() {
  const maxParticles = currentWeather === 'rain' ? 80 : currentWeather === 'snow' ? 50 : 0;
  const spawnRate = currentWeather === 'rain' ? 3 : currentWeather === 'snow' ? 1 : 0;
  for (let i = 0; i < spawnRate; i++) {
    if (weatherParticles.length < maxParticles) spawnWeatherParticle();
  }
  for (let i = weatherParticles.length - 1; i >= 0; i--) {
    const p = weatherParticles[i];
    p.y += p.speed;
    if (currentWeather === 'rain') { p.x += p.wind; }
    else if (currentWeather === 'snow') { p.wobble += p.wobbleSpeed; p.x += Math.sin(p.wobble) * 0.8; }
    if (p.y > H) weatherParticles.splice(i, 1);
  }
}

function drawWeatherParticles() {
  if (currentWeather === 'rain') {
    ctx.strokeStyle = 'rgba(180,210,240,0.5)'; ctx.lineWidth = 1.5;
    for (const p of weatherParticles) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.wind * 2, p.y + p.length); ctx.stroke(); }
  } else if (currentWeather === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const p of weatherParticles) { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
  }
}

// --- Stars ---
let stars = [];
function generateStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (H - GROUND_HEIGHT - 100), size: 0.5 + Math.random() * 2, twinkle: Math.random() * Math.PI * 2 });
  }
}
generateStars();

function drawStars() {
  for (const s of stars) {
    s.twinkle += 0.03;
    const alpha = 0.4 + Math.sin(s.twinkle) * 0.4;
    ctx.fillStyle = `rgba(255,255,240,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
  }
}

// --- Background birds ---
let bgBirds = [];
function spawnBgBird() {
  const fromRight = Math.random() > 0.5;
  bgBirds.push({
    x: fromRight ? W + 20 : -20, y: 40 + Math.random() * (H - GROUND_HEIGHT - 200),
    vx: fromRight ? -(0.8 + Math.random() * 1.5) : (0.8 + Math.random() * 1.5),
    size: 6 + Math.random() * 10, wingPhase: Math.random() * Math.PI * 2, wingSpeed: 0.08 + Math.random() * 0.06,
    color: ['#333', '#555', '#222', '#4A4A4A', '#2C2C2C'][Math.floor(Math.random() * 5)],
    yWobble: Math.random() * Math.PI * 2, yWobbleAmp: 0.3 + Math.random() * 0.8
  });
}

function updateBgBirds() {
  if (Math.random() < 0.008) spawnBgBird();
  for (let i = bgBirds.length - 1; i >= 0; i--) {
    const b = bgBirds[i]; b.x += b.vx; b.wingPhase += b.wingSpeed; b.yWobble += 0.02; b.y += Math.sin(b.yWobble) * b.yWobbleAmp;
    if (b.x < -40 || b.x > W + 40) bgBirds.splice(i, 1);
  }
}

function drawBgBird(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.vx < 0) ctx.scale(-1, 1);
  const wingY = Math.sin(b.wingPhase) * b.size * 0.6; const s = b.size;
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.8, s * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s * 0.2, 0); ctx.quadraticCurveTo(-s * 0.5, -wingY - s * 0.3, -s * 0.9, -wingY); ctx.quadraticCurveTo(-s * 0.5, -wingY * 0.3, -s * 0.2, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s * 0.2, 0); ctx.quadraticCurveTo(s * 0.5, -wingY - s * 0.3, s * 0.9, -wingY); ctx.quadraticCurveTo(s * 0.5, -wingY * 0.3, s * 0.2, 0); ctx.fill();
  ctx.fillStyle = '#E8A030'; ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.05); ctx.lineTo(s * 1.1, s * 0.05); ctx.lineTo(s * 0.7, s * 0.12); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBgBirds() { for (const b of bgBirds) drawBgBird(b); }

// --- Game state ---
let bird, pipes, score, bestScore, gameState, lastPipeTime, frameCount;
bestScore = 0;

function resetGame() {
  bird = { x: 80, y: H / 2, vy: 0, radius: 28, wingAngle: 0, wingDir: 1, rotation: 0, deadTimer: 0, eyeState: 'normal' };
  pipes = []; score = 0; gameState = 'start'; lastPipeTime = 0; frameCount = 0;
  weatherParticles = []; bgBirds = [];
  nameRegistered = false; showingRanking = false;
  hideNameInput();
  pickWeather(); generateStars();
}

resetGame();

// --- Input ---
function jump() {
  if (nameOverlay.classList.contains('active')) return;
  if (showingRanking) {
    showingRanking = false;
    resetGame();
    return;
  }
  if (gameState === 'start') {
    gameState = 'playing'; bird.vy = JUMP_FORCE; lastPipeTime = Date.now();
  } else if (gameState === 'playing') {
    bird.vy = JUMP_FORCE;
  } else if (gameState === 'dead' && bird.deadTimer > 40) {
    if (!nameRegistered) {
      showNameInput();
    } else {
      resetGame();
    }
  }
}

canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (nameOverlay.classList.contains('active')) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});

// --- Pipe generation ---
function spawnPipe() {
  const diff = getDifficulty(score);
  const gap = diff.pipeGap;
  const minTop = 60; const maxTop = H - GROUND_HEIGHT - gap - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: W + 10, topH: topH, baseTopH: topH, gap: gap, scored: false,
    moving: diff.pipeMovement && Math.random() > 0.4,
    amplitude: diff.pipeAmplitude, oscillationSpeed: diff.pipeOscillationSpeed, phase: Math.random() * Math.PI * 2
  });
}

// --- Collision ---
function checkCollision() {
  const bx = bird.x, by = bird.y, br = bird.radius - 4;
  if (by + br > H - GROUND_HEIGHT || by - br < 0) return true;
  for (const p of pipes) {
    const pw = p.moving ? PIPE_WIDTH + MOVING_PIPE_EXTRA : PIPE_WIDTH;
    if (bx + br > p.x && bx - br < p.x + pw) {
      if (by - br < p.topH || by + br > p.topH + p.gap) return true;
    }
  }
  return false;
}

// --- Drawing ---
function drawSky() {
  const colors = getWeatherColors();
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
  grad.addColorStop(0, colors.skyTop); grad.addColorStop(0.5, colors.skyMid); grad.addColorStop(1, colors.skyBot);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);
  if (currentWeather === 'night') drawStars();
  if (currentWeather === 'sunny') {
    ctx.fillStyle = 'rgba(255,240,100,0.3)'; ctx.beginPath(); ctx.arc(320, 70, 50, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFE44D'; ctx.beginPath(); ctx.arc(320, 70, 30, 0, Math.PI * 2); ctx.fill();
  } else if (currentWeather === 'sunset') {
    ctx.fillStyle = 'rgba(255,100,50,0.4)'; ctx.beginPath(); ctx.arc(300, H - GROUND_HEIGHT - 40, 60, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FF6B35'; ctx.beginPath(); ctx.arc(300, H - GROUND_HEIGHT - 40, 35, 0, Math.PI * 2); ctx.fill();
  } else if (currentWeather === 'night') {
    ctx.fillStyle = 'rgba(220,230,240,0.15)'; ctx.beginPath(); ctx.arc(320, 80, 40, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E8EDF2'; ctx.beginPath(); ctx.arc(320, 80, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#161B22'; ctx.beginPath(); ctx.arc(330, 75, 18, 0, Math.PI * 2); ctx.fill();
  }
  const colors2 = getWeatherColors(); ctx.fillStyle = colors2.cloud;
  const cloudOffset = (frameCount * 0.3) % (W + 200);
  drawCloud(W - cloudOffset, 60, 50); drawCloud(W - cloudOffset + 300, 120, 40); drawCloud(W - cloudOffset + 150, 200, 35);
  if (currentWeather === 'cloudy' || currentWeather === 'rain') {
    drawCloud(W - cloudOffset + 80, 50, 55); drawCloud(W - cloudOffset + 220, 90, 48); drawCloud(W - cloudOffset + 370, 160, 42);
  }
}

function drawCloud(x, y, size) {
  ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.arc(x + size * 0.7, y - size * 0.3, size * 0.7, 0, Math.PI * 2); ctx.arc(x + size * 1.2, y, size * 0.8, 0, Math.PI * 2); ctx.fill();
}

function drawGround() {
  ctx.fillStyle = '#8B4513'; ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
  ctx.fillStyle = currentWeather === 'snow' ? '#E8EDF2' : '#4CAF50'; ctx.fillRect(0, H - GROUND_HEIGHT, W, 12);
  const diff = getDifficulty(score); const grassOffset = (frameCount * diff.pipeSpeed) % 20;
  ctx.strokeStyle = currentWeather === 'snow' ? '#CDD5DB' : '#2E7D32'; ctx.lineWidth = 2;
  for (let x = -grassOffset; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x, H - GROUND_HEIGHT + 12); ctx.lineTo(x + 5, H - GROUND_HEIGHT); ctx.stroke(); }
  if (currentWeather === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.ellipse(x + 15, H - GROUND_HEIGHT + 2, 18, 5, 0, 0, Math.PI * 2); ctx.fill(); }
  }
}

function drawPipe(p) {
  const pw = p.moving ? PIPE_WIDTH + MOVING_PIPE_EXTRA : PIPE_WIDTH;
  const grad1 = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
  grad1.addColorStop(0, '#2E7D32'); grad1.addColorStop(0.3, '#66BB6A'); grad1.addColorStop(0.7, '#43A047'); grad1.addColorStop(1, '#1B5E20');

  if (p.moving && gameState === 'playing') { ctx.shadowColor = 'rgba(255,100,100,0.3)'; ctx.shadowBlur = 12; }

  // Top pipe
  ctx.fillStyle = grad1;
  ctx.fillRect(p.x, 0, pw, p.topH);
  ctx.fillStyle = '#1B5E20';
  ctx.fillRect(p.x - 5, p.topH - 25, pw + 10, 25);
  ctx.strokeStyle = '#145214'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x - 5, p.topH - 25, pw + 10, 25);

  // Bottom pipe
  const botY = p.topH + p.gap;
  ctx.fillStyle = grad1;
  ctx.fillRect(p.x, botY, pw, H - GROUND_HEIGHT - botY);
  ctx.fillStyle = '#1B5E20';
  ctx.fillRect(p.x - 5, botY, pw + 10, 25);
  ctx.strokeStyle = '#145214';
  ctx.strokeRect(p.x - 5, botY, pw + 10, 25);

  if (p.moving && gameState === 'playing') {
    ctx.fillStyle = 'rgba(255,200,200,0.5)'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('↕', p.x + pw / 2, p.topH - 30);
  }
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
}

function drawBird() {
  ctx.save(); ctx.translate(bird.x, bird.y);
  if (gameState === 'dead') { bird.rotation += 0.15; ctx.rotate(bird.rotation); }
  else { ctx.rotate(Math.min(bird.vy * 0.04, 0.8)); }
  const r = bird.radius;

  // Legs
  const legSwing = gameState === 'dead' ? Math.sin(bird.deadTimer * 0.3) * 0.6 : Math.sin(frameCount * 0.15) * 0.3;
  ctx.strokeStyle = '#D4A574'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.save(); ctx.translate(-8, r - 2); ctx.rotate(legSwing - 0.15);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 18); ctx.stroke();
  ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(0, 20, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(8, r - 2); ctx.rotate(-legSwing + 0.15);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 18); ctx.stroke();
  ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(0, 20, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // Wings
  bird.wingAngle += bird.wingDir * 0.2;
  if (bird.wingAngle > 1.0 || bird.wingAngle < -0.5) bird.wingDir *= -1;
  if (gameState === 'playing' && bird.vy < -2) bird.wingAngle += bird.wingDir * 0.3;
  const wingFlap = Math.sin(bird.wingAngle * Math.PI) * 12;
  ctx.save(); ctx.translate(-r - 2, -2);
  ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#C8A200'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(-10, wingFlap, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, wingFlap - 3); ctx.lineTo(-18, wingFlap); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(r + 2, -2);
  ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#C8A200'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(10, wingFlap, 16, 8, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(5, wingFlap - 3); ctx.lineTo(18, wingFlap); ctx.stroke(); ctx.restore();

  // Face
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  if (faceLoaded) {
    const imgSize = r * 2.2;
    ctx.drawImage(faceImg, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
    if (gameState === 'dead') { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(-r, -r, r * 2, r * 2); }
  } else {
    ctx.fillStyle = '#FFD9B3'; ctx.fillRect(-r, -r, r * 2, r * 2);
  }
  ctx.restore();

  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5; ctx.stroke();

  // Dead overlay
  if (gameState === 'dead') {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const ex = -10, ey = -5, es = 6;
    ctx.beginPath(); ctx.moveTo(ex - es, ey - es); ctx.lineTo(ex + es, ey + es); ctx.moveTo(ex + es, ey - es); ctx.lineTo(ex - es, ey + es); ctx.stroke();
    const ex2 = 10;
    ctx.beginPath(); ctx.moveTo(ex2 - es, ey - es); ctx.lineTo(ex2 + es, ey + es); ctx.moveTo(ex2 + es, ey - es); ctx.lineTo(ex2 - es, ey + es); ctx.stroke();
    ctx.fillStyle = '#FF6B6B'; ctx.beginPath(); ctx.ellipse(2, 14, 5, 7, 0.2, 0, Math.PI); ctx.fill();
    const starAngle = bird.deadTimer * 0.08;
    for (let i = 0; i < 3; i++) {
      const a = starAngle + (i * Math.PI * 2 / 3);
      drawStar(Math.cos(a) * (r + 15), Math.sin(a) * (r + 15), 5, 3);
    }
  }
  ctx.restore();
}

function drawStar(x, y, outerR, innerR) {
  ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#FFA000'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    ctx.lineTo(x + Math.cos(angle) * outerR, y + Math.sin(angle) * outerR);
    const angle2 = angle + (2 * Math.PI) / 10;
    ctx.lineTo(x + Math.cos(angle2) * innerR, y + Math.sin(angle2) * innerR);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawScore() {
  ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.font = 'bold 48px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
  ctx.strokeText(score, W / 2, 60); ctx.fillText(score, W / 2, 60);
}

function drawLevelIndicator() {
  const diff = getDifficulty(score);
  if (diff.level > 0) {
    ctx.font = 'bold 14px "Segoe UI", sans-serif'; ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
    const txt = 'Lv.' + diff.level;
    ctx.strokeText(txt, W - 15, 30); ctx.fillText(txt, W - 15, 30);
    const barW = 50, barH = 5, barX = W - 15 - barW, barY = 36;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(barX, barY, barW, barH);
    const fill = diff.level / 10;
    const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    barGrad.addColorStop(0, '#4CAF50'); barGrad.addColorStop(0.5, '#FFC107'); barGrad.addColorStop(1, '#E94560');
    ctx.fillStyle = barGrad; ctx.fillRect(barX, barY, barW * fill, barH);
  }
}

function drawWeatherIcon() {
  ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
  const icons = { sunny: '☀️', cloudy: '☁️', rain: '🌧️', snow: '❄️', sunset: '🌅', night: '🌙' };
  ctx.fillText(icons[currentWeather] || '', 12, 28);
}

function drawStartScreen() {
  ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#E94560'; ctx.lineWidth = 5;
  ctx.font = 'bold 36px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
  ctx.strokeText('Flappy アニマル', W / 2, 140); ctx.fillText('Flappy アニマル', W / 2, 140);
  ctx.font = 'bold 16px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  ctx.strokeText('〜 顔面フライトシミュレーター 〜', W / 2, 175); ctx.fillText('〜 顔面フライトシミュレーター 〜', W / 2, 175);
  const bounce = Math.sin(frameCount * 0.06) * 8;
  ctx.font = '20px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
  ctx.strokeText('タップ or スペースキー', W / 2, 420 + bounce); ctx.fillText('タップ or スペースキー', W / 2, 420 + bounce);
  ctx.font = '16px "Segoe UI", sans-serif'; ctx.fillStyle = '#CCC';
  ctx.strokeText('でスタート！', W / 2, 450 + bounce); ctx.fillText('でスタート！', W / 2, 450 + bounce);
  const icons = { sunny: '☀️ 晴れ', cloudy: '☁️ くもり', rain: '🌧️ 雨', snow: '❄️ 雪', sunset: '🌅 夕焼け', night: '🌙 夜' };
  ctx.font = '15px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeText('今日の天気: ' + (icons[currentWeather] || ''), W / 2, 490); ctx.fillText('今日の天気: ' + (icons[currentWeather] || ''), W / 2, 490);

  // Show ranking on start screen if available
  if (rankings.length > 0) {
    ctx.font = 'bold 14px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText('🏆 トップ: ' + rankings[0].name + ' - ' + rankings[0].score, W / 2, 520);
    ctx.fillText('🏆 トップ: ' + rankings[0].name + ' - ' + rankings[0].score, W / 2, 520);
  } else if (bestScore > 0) {
    ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText('🏆 ベスト: ' + bestScore, W / 2, 520); ctx.fillText('🏆 ベスト: ' + bestScore, W / 2, 520);
  }
}

function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#E94560'; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
  ctx.font = 'bold 42px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
  ctx.strokeText('GAME OVER', W / 2, 180); ctx.fillText('GAME OVER', W / 2, 180);
  const msgs = ['顔面着陸ｗｗｗ', '痛そう…🤣', 'もう一回？😏', '翼が足りなかった…', '顔から突っ込むなｗ', '重力には勝てない💀', 'ﾌﾞﾁｯ（潰れる音）'];
  ctx.font = '22px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.strokeText(msgs[score % msgs.length], W / 2, 230); ctx.fillText(msgs[score % msgs.length], W / 2, 230);
  ctx.font = '28px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFF';
  ctx.strokeText('スコア: ' + score, W / 2, 300); ctx.fillText('スコア: ' + score, W / 2, 300);
  const diff = getDifficulty(score);
  ctx.font = '16px "Segoe UI", sans-serif'; ctx.fillStyle = '#CCC';
  ctx.fillText('到達レベル: ' + diff.level, W / 2, 330);
  if (score >= bestScore && score > 0) {
    ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#FF6B6B';
    ctx.fillText('🎉 NEW RECORD!', W / 2, 360);
  }
  ctx.font = '20px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFF'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeText('🏆 ベスト: ' + bestScore, W / 2, 400); ctx.fillText('🏆 ベスト: ' + bestScore, W / 2, 400);

  if (!nameRegistered) {
    const bounce = Math.sin(frameCount * 0.08) * 5;
    ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#CCC';
    ctx.textAlign = 'center';
    ctx.strokeText('タップで名前登録', W / 2, 460 + bounce); ctx.fillText('タップで名前登録', W / 2, 460 + bounce);
  }
}

function drawRankingScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px "Segoe UI", sans-serif'; ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText('🏆 ランキング', W / 2, 70); ctx.fillText('🏆 ランキング', W / 2, 70);

  const startY = 120;
  const lineH = 40;
  for (let i = 0; i < Math.min(rankings.length, 10); i++) {
    const r = rankings[i];
    const y = startY + i * lineH;
    const isTop3 = i < 3;
    const medals = ['🥇', '🥈', '🥉'];

    ctx.font = isTop3 ? 'bold 20px "Segoe UI", sans-serif' : '18px "Segoe UI", sans-serif';
    ctx.fillStyle = isTop3 ? '#FFD700' : '#DDD';

    const prefix = i < 3 ? medals[i] : (i + 1) + '.';
    const text = prefix + ' ' + r.name + '  —  ' + r.score;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeText(text, W / 2, y);
    ctx.fillText(text, W / 2, y);
  }

  if (rankings.length === 0) {
    ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#999';
    ctx.textAlign = 'center';
    ctx.fillText('まだ記録がありません', W / 2, startY + 40);
  }

  const bounce = Math.sin(frameCount * 0.08) * 5;
  ctx.font = '18px "Segoe UI", sans-serif'; ctx.fillStyle = '#CCC';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.textAlign = 'center';
  ctx.strokeText('タップでリトライ', W / 2, 540 + bounce);
  ctx.fillText('タップでリトライ', W / 2, 540 + bounce);
}

// --- Main loop ---
function update() {
  frameCount++;
  updateBgBirds();
  updateWeatherParticles();

  if (gameState === 'playing') {
    const diff = getDifficulty(score);
    bird.vy += GRAVITY; bird.y += bird.vy;
    const now = Date.now();
    if (now - lastPipeTime > diff.pipeInterval) { spawnPipe(); lastPipeTime = now; }

    for (let i = pipes.length - 1; i >= 0; i--) {
      pipes[i].x -= diff.pipeSpeed;
      if (pipes[i].moving) {
        pipes[i].phase += pipes[i].oscillationSpeed;
        const offset = Math.sin(pipes[i].phase) * pipes[i].amplitude;
        const newTopH = pipes[i].baseTopH + offset;
        const minTop = 30; const maxTop = H - GROUND_HEIGHT - pipes[i].gap - 30;
        pipes[i].topH = Math.max(minTop, Math.min(maxTop, newTopH));
      }
      const pw = pipes[i].moving ? PIPE_WIDTH + MOVING_PIPE_EXTRA : PIPE_WIDTH;
      if (!pipes[i].scored && pipes[i].x + pw < bird.x) { pipes[i].scored = true; score++; }
      if (pipes[i].x + pw < -10) pipes.splice(i, 1);
    }

    if (checkCollision()) {
      gameState = 'dead'; bird.eyeState = 'dead';
      if (score > bestScore) bestScore = score;
    }
  }

  if (gameState === 'dead') {
    bird.deadTimer++;
    if (bird.y < H - GROUND_HEIGHT - bird.radius) { bird.vy += GRAVITY * 0.5; bird.y += bird.vy; }
  }

  if (gameState === 'start') { bird.y = H / 2 + Math.sin(frameCount * 0.04) * 15; }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky(); drawBgBirds(); drawWeatherParticles();
  for (const p of pipes) drawPipe(p);
  drawGround();

  if (currentWeather === 'rain') {
    ctx.strokeStyle = 'rgba(180,210,240,0.25)'; ctx.lineWidth = 1;
    for (let i = 0; i < weatherParticles.length; i += 3) {
      const p = weatherParticles[i]; if (!p) continue;
      ctx.beginPath(); ctx.moveTo(p.x + 1, p.y); ctx.lineTo(p.x + p.wind, p.y + p.length * 0.5); ctx.stroke();
    }
  }

  drawBird();

  if (showingRanking) {
    drawRankingScreen();
  } else if (gameState === 'playing') {
    drawScore(); drawLevelIndicator(); drawWeatherIcon();
  } else if (gameState === 'start') {
    drawBird(); drawStartScreen();
  } else if (gameState === 'dead') {
    drawScore(); drawDeadScreen();
  }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
